<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Attendance - Mentorship</title>

  <link rel="icon" type="image/png" href="logo2.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F2937">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Attendance">
  <link rel="apple-touch-icon" href="logo2.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://mlaahl.online" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">

  <script src="js/config.js"></script>

  <style>
    :root {
      --primary-color: #6366F1;
      --text-primary: #334155;
      --text-secondary: #64748B;
      --bg-accent: #F8FAFC;
      --danger: #EF4444;
      --success: #10B981;
      --border: #E2E8F0;
    }

    .material-symbols-rounded {
      font-family: 'Material Symbols Rounded', sans-serif;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-accent);
      color: var(--text-primary);
      padding-bottom: 96px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    .topbar {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 14px 0; position: sticky; top: 0; z-index: 30;
    }
    .topbar .wrap { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--bg-accent);
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary);
      flex-shrink: 0; text-decoration: none;
    }
    .topbar h1 { font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
    .topbar .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 1px; }

    /* Controls card */
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; margin-top: 16px;
    }
    .field-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-secondary); margin-bottom: 6px; display: block;
    }
    input[type="date"], input[type="search"] {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
      font-family: inherit; font-size: 15px; color: var(--text-primary); background: #fff; outline: none;
    }
    input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }

    .stats { display: flex; gap: 10px; margin-top: 14px; }
    .stat {
      flex: 1; background: var(--bg-accent); border-radius: 12px; padding: 10px 12px; text-align: center;
    }
    .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat .l { font-size: 10.5px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .stat.ok .v { color: var(--success); }
    .stat.no .v { color: var(--danger); }

    .quick-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn-ghost {
      flex: 1; padding: 10px; border: 1px solid var(--border); background: #fff; border-radius: 10px;
      font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-primary); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-ghost:active { background: var(--bg-accent); }
    .btn-ghost .material-symbols-rounded { font-size: 17px; }

    /* Groups */
    .group { margin-top: 16px; }
    .group-head {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
      position: sticky; top: 68px; z-index: 10;
    }
    .group-head .chev { transition: transform .2s; color: var(--text-secondary); font-size: 20px; }
    .group.collapsed .chev { transform: rotate(-90deg); }
    .group-head .title { flex: 1; font-weight: 700; font-size: 14.5px; }
    .group-head .count {
      font-size: 12px; font-weight: 700; color: var(--text-secondary);
      background: var(--bg-accent); padding: 3px 9px; border-radius: 20px; font-variant-numeric: tabular-nums;
    }
    .group-head .mark-all {
      border: none; background: rgba(99,102,241,.1); color: var(--primary-color);
      font-family: inherit; font-size: 11.5px; font-weight: 700; padding: 5px 10px; border-radius: 8px; cursor: pointer;
    }
    .group-body { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .group.collapsed .group-body { display: none; }

    .student {
      display: flex; align-items: center; gap: 12px; padding: 11px 14px;
      background: #fff; border: 1px solid var(--border); border-radius: 12px; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .student.present { border-color: rgba(16,185,129,.45); background: rgba(16,185,129,.05); }
    .student.hidden { display: none; }
    .tick {
      width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff;
    }
    .student.present .tick { background: var(--success); border-color: var(--success); }
    .tick .material-symbols-rounded { font-size: 16px; opacity: 0; }
    .student.present .tick .material-symbols-rounded { opacity: 1; }
    .student .nm { flex: 1; font-size: 14.5px; font-weight: 600; }
    .student .sid { font-size: 11.5px; color: var(--text-secondary); font-family: ui-monospace, Consolas, monospace; }

    /* Submit bar */
    .submitbar {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
      border-top: 1px solid var(--border); padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    }
    .submitbar .wrap { display: flex; align-items: center; gap: 12px; }
    .submit-info { flex-shrink: 0; font-size: 12.5px; color: var(--text-secondary); font-weight: 600; }
    .submit-info b { color: var(--text-primary); font-size: 15px; }
    .btn-primary {
      flex: 1; padding: 14px; border: none; border-radius: 12px; background: var(--primary-color);
      color: #fff; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:disabled { opacity: .55; cursor: default; }

    .msg { padding: 32px 20px; text-align: center; color: var(--text-secondary); font-size: 14px; }
    .msg .material-symbols-rounded { font-size: 44px; color: var(--border); display: block; margin: 0 auto 10px; }
    .warn-box {
      background: #FFFBEB; border: 1px solid #FDE68A; color: #92400E;
      border-radius: 12px; padding: 11px 13px; font-size: 12.5px; margin-top: 12px; line-height: 1.5;
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }

    /* Toast */
    #toast {
      position: fixed; left: 50%; transform: translateX(-50%) translateY(-20px); top: 16px;
      background: #1F2937; color: #fff; padding: 12px 18px; border-radius: 12px;
      font-size: 13.5px; font-weight: 600; z-index: 100; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; max-width: 90%; text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.err { background: var(--danger); }
    #toast.ok { background: var(--success); }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="wrap">
      <a class="back-btn" href="myclass.html" aria-label="Back to my classes">
        <span class="material-symbols-rounded">arrow_back</span>
      </a>
      <div style="flex:1; min-width:0;">
        <h1>Mentorship Attendance</h1>
        <div class="sub" id="mentorSub">Loading…</div>
      </div>
      <a class="back-btn" href="mentorship-register.html" aria-label="View mentoring register" title="Register">
        <span class="material-symbols-rounded">table_chart</span>
      </a>
    </div>
  </div>

  <div class="wrap">

    <div id="loadingState" class="msg">
      <span class="material-symbols-rounded">hourglass_empty</span>
      Loading your mentees…
    </div>

    <div id="emptyState" class="msg hidden">
      <span class="material-symbols-rounded">group_off</span>
      <div id="emptyText">You do not have any mentees assigned yet.</div>
    </div>

    <div id="main" class="hidden">
      <div class="card">
        <label class="field-label" for="sessionDate">Session date</label>
        <input type="date" id="sessionDate">

        <div class="stats">
          <div class="stat"><div class="v" id="statTotal">0</div><div class="l">Mentees</div></div>
          <div class="stat ok"><div class="v" id="statPresent">0</div><div class="l">Present</div></div>
          <div class="stat no"><div class="v" id="statAbsent">0</div><div class="l">Absent</div></div>
        </div>

        <div class="quick-row">
          <button class="btn-ghost" id="allPresentBtn">
            <span class="material-symbols-rounded">done_all</span> All present
          </button>
          <button class="btn-ghost" id="clearBtn">
            <span class="material-symbols-rounded">remove_done</span> Clear
          </button>
        </div>

        <div style="margin-top:12px;">
          <input type="search" id="searchBox" placeholder="Search name or ID…" autocomplete="off">
        </div>

        <div id="existingNote" class="warn-box hidden"></div>
        <div id="missingNote" class="warn-box hidden"></div>
      </div>

      <div id="groups"></div>
    </div>
  </div>

  <div class="submitbar hidden" id="submitBar">
    <div class="wrap">
      <div class="submit-info"><b id="barPresent">0</b>/<span id="barTotal">0</span><br>present</div>
      <button class="btn-primary" id="submitBtn">
        <span class="material-symbols-rounded">send</span>
        <span id="submitText">Submit Attendance</span>
      </button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { firebaseConfig } from './firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.firebaseAuth = auth;
    window.firebaseSignOut = signOut;
    window.firebaseOnAuthStateChanged = onAuthStateChanged;

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      window.dispatchEvent(new CustomEvent('mentorship:ready'));
    });
  </script>

  <script src="js/mentorship.js?v=2"></script>
</body>

</html>
